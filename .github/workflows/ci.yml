name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-and-native:
    # The context name comes from `matrix.name`, never the runner label, so an image bump does
    # not rename the required status check.
    name: portable-and-native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest
            runner: ubuntu-latest
          # macOS 27 with Xcode 27 (arm64, public preview). Replaces `macos-latest`; no second macOS leg.
          - name: macos
            runner: xcode-27
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Runner is macOS 27
        if: runner.os == 'macOS'
        run: |
          sw_vers
          xcodebuild -version
          test "$(sw_vers -productVersion | cut -d. -f1)" = 27
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-deny@0.20.2
      # Controlled blocks and the production driver only. No native hardware entry.
      - run: make all
