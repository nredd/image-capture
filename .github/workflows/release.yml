name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  CARGO_BUILD_JOBS: 2
  RUST_TOOLCHAIN: 1.99.1
  MACOSX_DEPLOYMENT_TARGET: '13.0'
jobs:
  gate:
    # Ignore fork tags; only version tags in this repository can reach publication.
    if: github.repository == 'nredd/icc-ptp-safe' && startsWith(github.ref, 'refs/tags/v')
    # macOS on purpose: the ImageCaptureCore code only compiles there, `make all` runs its
    # controlled native tests, and `cargo publish` verification builds for the host. A Linux
    # runner would verify only the portable modules.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Release commit belongs to protected main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - name: Tag matches Cargo.toml version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$TAG" = "v$version"
      # Controlled blocks and the production driver only. No camera hardware, never --hardware-admitted.
      - run: make all
      - run: cargo publish --dry-run --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crate-${{ github.sha }}
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: gate
    # macOS for the same reason as `gate`: publish verification compiles the crate for the host.
    runs-on: macos-latest
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write # Only this job can exchange a crates.io OIDC identity.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: crate-${{ github.sha }}
          path: ${{ runner.temp }}/gated-package
      - run: cargo publish --dry-run --locked
      - name: Rebuilt publication matches the gated archive byte for byte
        run: cmp "$RUNNER_TEMP"/gated-package/*.crate target/package/*.crate
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish once, never overwrite an existing registry version
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: crates-io
    permissions:
      contents: write # No OIDC or registry credential in the asset/release job.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: crate-${{ github.sha }}
          path: ${{ runner.temp }}/gated-package
      # Existing drafts/releases fail closed. No --clobber, deletion or tag rewriting.
      - name: Release notes are the tagged version's changelog section
        run: |
          version="${TAG#v}"
          awk -v v="$version" '/^## \[/ { on = index($0, "## [" v "]") == 1; next } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
      - name: Stage every asset before immutable publication
        run: gh release create "$TAG" "$RUNNER_TEMP"/gated-package/*.crate --draft --verify-tag --target "$COMMIT" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Publish the fully staged draft
        run: gh release edit "$TAG" --draft=false
